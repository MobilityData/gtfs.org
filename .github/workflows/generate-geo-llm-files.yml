name: Generate GEO files for LLMs (llms.txt, index.generated.md)

# Regenerates the files that describe the site to LLMs, and opens or updates one pull request per file type when they change:
# - docs/<lang>/llms.txt (https://llmstxt.org), served at /llms.txt, /fr/llms.txt, /es/llms.txt, /ja/llms.txt
# - docs/<lang>/index.generated.md, a Markdown version of each templated homepage, rendered from the template with Jinja2 (no site build; the site build ignores these files through exclude_docs)
# Runs only when something in docs/ (other than the generated files themselves), the MkDocs configs, the homepage template or its locale files change, or when triggered manually.
# The commits and pull requests are made with the token loaded from 1Password, so the workflow's own GITHUB_TOKEN only needs to read the repository.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '!docs/*/llms.txt'
      - '!docs/*/index.generated.md'
      - 'config/**'
      - 'overrides/home.html'
      - 'overrides/locales/**'
      - 'scripts/geo_llm_files/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llms-txt:
    name: Generate llms.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11

      - name: Install PyYAML
        run: pip install "$(grep -iE '^pyyaml==' requirements.txt)"

      - name: Generate llms.txt for every language
        run: python3 scripts/geo_llm_files/generate_llms_txt.py

      # Loaded only now, so that no earlier step runs with the token in its environment.
      - name: Load secrets from 1Password
        id: onepw_secrets
        uses: 1password/load-secrets-action@v5.0.1
        with:
          export-env: true # Export loaded secrets as environment variables
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: "op://rbiv7rvkkrsdlpcrz3bmv7nmcu/GitHub generic action token for all repos/credential"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ env.GITHUB_TOKEN }}
          sign-commits: true
          assignees: "fredericsimard"
          branch: chore/llms-txt
          add-paths: docs/*/llms.txt
          commit-message: 'chore: update generated llms.txt files'
          title: 'chore: update generated llms.txt files'
          body: 'Generated by the `Generate GEO files for LLMs` workflow from the `nav:` of `config/<lang>/mkdocs.yml` and the pages in `docs/`. Do not edit these files by hand; change the pages or the nav instead.'
          delete-branch: true

  index-generated-md:
    name: Generate index.generated.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11

      - name: Install PyYAML and Jinja2
        run: pip install $(grep -iE '^(pyyaml|jinja2|markupsafe)==' requirements.txt)

      - name: Render each templated homepage and convert it to Markdown
        run: python3 scripts/geo_llm_files/generate_index_generated_md.py

      # Loaded only now, so that no earlier step runs with the token in its environment.
      - name: Load secrets from 1Password
        id: onepw_secrets
        uses: 1password/load-secrets-action@v5.0.1
        with:
          export-env: true # Export loaded secrets as environment variables
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: "op://rbiv7rvkkrsdlpcrz3bmv7nmcu/GitHub generic action token for all repos/credential"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ env.GITHUB_TOKEN }}
          sign-commits: true
          assignees: "fredericsimard"
          branch: chore/index-generated-md
          add-paths: docs/*/index.generated.md
          commit-message: 'chore: update generated index.generated.md files'
          title: 'chore: update generated index.generated.md files'
          body: 'Generated by the `Generate GEO files for LLMs` workflow: a Markdown version of each homepage rendered from `overrides/home.html` and its locale files, for LLMs. Do not edit these files by hand; change the template or its locale files instead.'
          delete-branch: true
